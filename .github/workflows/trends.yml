name: Google Trends market collector
on:
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
concurrency:
  group: newsdesk-trends
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch trusted collector from this workflow revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/contents/trends/collect.mjs?ref=$GITHUB_SHA" --jq .content | base64 --decode > "$RUNNER_TEMP/collect.mjs"
      - name: Collect official market rankings with temporary Google credentials
        env:
          GH_TOKEN: ${{ github.token }}
        run: node "$RUNNER_TEMP/collect.mjs"
